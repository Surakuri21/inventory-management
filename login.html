<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- External dependencies -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Session timeout warning -->
    <script>
        // Warn user before session expires
        const sessionTimeout = 1800 * 1000;
        let warningTime = sessionTimeout - (5 * 60 * 1000);

        setTimeout(() => {
            if (confirm('Your session will expire soon. Do you want to stay logged in?')) {
                fetch('/index.php?route=keepalive', { method: 'POST' });
            } else {
                window.location.href = '/index.php?route=logout';
            }
        }, warningTime);
    </script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center bg-gray-100">

<main class="flex-1 overflow-y-auto p-6 bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto">
        <h1 class="mb-6 text-2xl font-bold text-gray-900">Dashboard</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-lg shadow-md p-6"><div class="flex items-center justify-between"><div><p class="text-sm font-medium text-gray-500">Total Products</p><p class="text-3xl font-bold text-gray-900 mt-1">0</p></div><div class="p-2 bg-blue-100 rounded-full"><i class="fas fa-box-open text-blue-500"></i></div></div></div>
            <div class="bg-white rounded-lg shadow-md p-6"><div class="flex items-center justify-between"><div><p class="text-sm font-medium text-gray-500">Low Stock Items</p><p class="text-3xl font-bold text-green-500 mt-1">0</p></div><div class="p-2 bg-green-100 rounded-full"><i class="fas fa-check-circle text-green-500"></i></div></div></div>
            <div class="bg-white rounded-lg shadow-md p-6"><div class="flex items-center justify-between"><div><p class="text-sm font-medium text-gray-500">Out of Stock</p><p class="text-3xl font-bold text-green-500 mt-1">0</p></div><div class="p-2 bg-green-100 rounded-full"><i class="fas fa-check-circle text-green-500"></i></div></div></div>
            <div class="bg-white rounded-lg shadow-md p-6"><div class="flex items-center justify-between"><div><p class="text-sm font-medium text-gray-500">Categories</p><p class="text-3xl font-bold text-gray-900 mt-1">5</p></div><div class="p-2 bg-purple-100 rounded-full"><i class="fas fa-tags text-purple-500"></i></div></div></div>
            <div class="bg-white rounded-lg shadow-md p-6"><div class="flex items-center justify-between"><div><p class="text-sm font-medium text-gray-500">Suppliers</p><p class="text-3xl font-bold text-gray-900 mt-1">3</p></div><div class="p-2 bg-indigo-100 rounded-full"><i class="fas fa-truck text-indigo-500"></i></div></div></div>
            <div class="bg-white rounded-lg shadow-md p-6"><div class="flex items-center justify-between"><div><p class="text-sm font-medium text-gray-500">Today's Transactions</p><p class="text-3xl font-bold text-gray-900 mt-1">0</p></div><div class="p-2 bg-teal-100 rounded-full"><i class="fas fa-chart-bar text-teal-500"></i></div></div></div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                            <div class="bg-white rounded-lg shadow-md p-6"><h2 class="mb-4 text-xl font-semibold text-gray-900 flex items-center"><i class="fas fa-check-circle mr-2 text-green-500"></i> Inventory Status</h2><div class="text-center py-8"><i class="fas fa-check-circle text-4xl text-green-500 mb-4"></i><p class="text-gray-600">All products are above their low stock thresholds!</p></div></div>
                        <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="mb-4 text-xl font-semibold text-gray-900">Recent Transactions</h2>
                                    <div class="text-center py-8"><i class="fas fa-chart-line text-3xl text-gray-400 mb-4"></i><p class="text-gray-500">No recent transactions.</p></div>
                            </div>
        </div>
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="mb-4 text-xl font-semibold text-gray-900 flex items-center"><i class="fas fa-clipboard-list mr-2 text-blue-500"></i> Recent Activity</h2>
                            <div class="text-center py-8"><i class="fas fa-eye-slash text-3xl text-gray-400 mb-4"></i><p class="text-gray-500">No recent activity.</p></div>
                    </div>
    </div>
</main>
    </div>
    <!-- /Guest wrapper -->

<!-- JavaScript dependencies -->
<script src="/assets/js/main.js"></script>
</body>
</html>
