 # ---------------------------------------------------------
# HTTP -> HTTPS Redirect (Strict Protocol Separation)
# ---------------------------------------------------------
server {
    listen 80;
    server_name localhost;
    
    # Immediately drop unencrypted traffic and upgrade to TLS
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------
# Primary TLS Server Block
# ---------------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost;

    # Cryptographic Configuration
    ssl_certificate /etc/nginx/ssl/inventory.crt;
    ssl_certificate_key /etc/nginx/ssl/inventory.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Defense-in-Depth Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/html;
    index index.php index.html;

    location / {
    # Appends the requested path to a 'url' parameter, preserving existing query args
    try_files $uri $uri/ /index.php?url=$uri&$args;
}

    # PHP-FPM FastCGI Proxy
    location ~ \.php$ {
        try_files $uri =404;
        
        # 1. LOAD DEFAULTS FIRST (Prevents overwriting custom params)
        include fastcgi_params;
        
        # 2. INJECT CUSTOM STATE (Order is absolute in Nginx)
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # 3. EXPLICIT PROTOCOL MAPPING FOR PHP SESSION MIDDLEWARE
        fastcgi_param HTTPS 'on';
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        
        # 4. EXPLICIT ROUTING (Forces PHP to see '/login', not '/index.php')
        fastcgi_param REQUEST_URI $request_uri;
        
        fastcgi_read_timeout 300;
    }

    # Infrastructure Protection
    location ~ /\.(env|git) {
        deny all;
        return 403;
    }
}